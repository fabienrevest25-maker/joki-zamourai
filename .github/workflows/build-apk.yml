name: Build APK
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      # Le SDK Android est déjà installé sur les machines GitHub (ubuntu-latest).
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: '8.7' }
      - name: Embarquer les polices (facultatif, le jeu marche sans)
        continue-on-error: true
        run: bash tools/polices.sh
      - name: Recoller le jeu (index.html envoyé en morceaux de 20 Mo)
        run: |
          cd app/src/main/assets
          if ls index.part* >/dev/null 2>&1; then cat index.part* > index.html && rm index.part*; fi
          ls -l index.html
      - name: Clé de signature fixe (les mises à jour s'installent par-dessus l'ancienne version)
        env:
          JZ_KEY_PASS: ${{ secrets.JZ_KEY_PASS || secrets.JZ_KAY_PASS }}
        run: |
          if [ -n "$JZ_KEY_PASS" ] && [ -f signing/jz_debug.keystore.enc ]; then
            mkdir -p ~/.android
            openssl enc -d -aes-256-cbc -pbkdf2 -iter 200000 -in signing/jz_debug.keystore.enc -out ~/.android/debug.keystore -pass env:JZ_KEY_PASS
            echo "Clé fixe utilisée."
          else
            echo "::warning::Secret JZ_KEY_PASS absent : l'APK est signé avec une clé aléatoire et ne pourra pas mettre à jour l'appli déjà installée."
          fi
      - run: gradle assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: JokiZamurai-apk
          path: app/build/outputs/apk/debug/app-debug.apk
      - name: Ranger l'APK dans la branche « apk » (téléchargement direct)
        run: |
          mkdir /tmp/out && cp app/build/outputs/apk/debug/app-debug.apk /tmp/out/JokiZamurai.apk
          cd /tmp/out && git init -q -b apk && git add JokiZamurai.apk
          git -c user.name=github-actions -c user.email=github-actions@users.noreply.github.com commit -q -m "APK ${GITHUB_SHA::7}"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" apk
